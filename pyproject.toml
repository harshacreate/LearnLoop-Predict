[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "learnloop-predict"
version = "0.1.0"
description = "A synthetic course-term exercise using attendance, assessment performance, prior GPA, study time, LMS activity, late sub"
requires-python = ">=3.9"
dependencies = ["numpy==2.0.2", "scikit-learn==1.6.1"]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
